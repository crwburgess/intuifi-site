[build]
  publish = "."

[[redirects]]
  from = "/reports/test/report-data.html"
  to = "/.netlify/functions/report-data"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
