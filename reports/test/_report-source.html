<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategic Insights Report | Intuifi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --text: #374151;
      --border: #e5e7eb;
      --soft: #f2f2f2;

      --teal: #0f625c;
      --teal-accent: #3abcb5;
      --teal-soft: #e6f0ef;
      --teal-border: #b9d6d2;

      --amber: #92400e;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;

      --red: #991b1b;
      --red-soft: #fef2f2;
      --red-border: #fecaca;

      --blue: #2563eb;

      --radius: 18px;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
      --max: 1080px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 20px 64px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .page { max-width: var(--max); margin: 0 auto; }

    .header { margin-bottom: 14px; }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 28px;
      flex-wrap: wrap;
    }

    .header-title-block { min-width: 0; }

    .report-title {
      margin: 0;
      min-width: 0;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--ink);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 0.24em;
      row-gap: 0.08em;
    }

    .report-subtitle {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 0 0 auto;
    }

    .brand-logo {
      display: block;
      width: clamp(138px, 16vw, 180px);
      height: auto;
      flex: 0 0 auto;
      overflow: visible;
    }

    .logo-box {
      height: 48px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    .logo-box img,
    .logo-box svg {
      max-height: 100%;
      max-width: 150px;
      object-fit: contain;
      display: block;
    }

    .logo-box .brand-logo {
      width: auto;
      max-width: 140px;
      height: 32px;
    }

    .client-logo-fallback {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      border: 0;
      background: var(--teal);
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
      font-family: inherit;
    }

    .btn:hover { background: #0a4f4a; }

    .header-summary-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
      margin: 10px 0 2px;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      color: var(--teal);
    }

    .header-summary-line.flagged {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber);
    }

    .meta-cluster {
      display: grid;
      gap: 10px;
      margin: 18px 0 24px;
    }

    .meta-cluster.cols-1 { grid-template-columns: minmax(0, 1fr); max-width: 230px; }
    .meta-cluster.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .meta-cluster.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .meta-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .meta-card-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .meta-card-icon {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      color: var(--muted);
    }

    .meta-card-text {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .meta-card.primary { border-color: var(--teal-border); background: #ffffff; }
    .meta-card.warning { border-color: #8c8b8b; background: var(--soft); }

    .meta-card-clickable {
      cursor: pointer;
      font: inherit;
      appearance: none;
      -webkit-appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .meta-card-clickable:hover {
      box-shadow: 0 14px 32px rgba(146, 64, 14, 0.16);
      transform: translateY(-1px);
    }

    .meta-card-clickable:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .meta-card-jump-icon {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: var(--amber);
      opacity: 0.75;
    }

    .meta-card strong { font-size: 22px; color: var(--ink); line-height: 1.15; }
    .meta-card span { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .meta-card-delta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .meta-card-delta.emphasis {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--amber);
    }

    .meta-card-delta.emphasis.no-change {
      color: var(--muted);
      font-weight: 500;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 34px 0 14px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--teal);
      margin-bottom: 8px;
    }

    .section-note {
      margin: -6px 0 16px;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }

    .executive-card { padding: 0; overflow: hidden; }

    .executive-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .executive-body { padding: 20px; display: grid; gap: 16px; }

    .tldr-box {
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 15px;
      padding: 16px;
    }

    .tldr-label {
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--teal);
      margin-bottom: 7px;
    }

    .tldr-text {
      font-size: 16px;
      color: #1f2937;
      line-height: 1.5;
      font-weight: 650;
    }

    .executive-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .executive-panel {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 16px;
    }

    .executive-panel.tension { background: var(--amber-soft); border-color: var(--amber-border); }

    .panel-title { font-size: 14px; font-weight: 850; color: var(--ink); margin-bottom: 14px; }

    .summary-list { display: grid; gap: 14px; }

    .summary-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 14px;
      align-items: start;
    }

    .summary-icon {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      margin-top: 1px;
    }

    .summary-icon.check { background: var(--teal-soft); color: var(--teal); border: 1px solid var(--teal-border); }
    .summary-icon.warning { background: #fff7ed; color: var(--amber); border: 1px solid var(--amber-border); }

    .summary-headline { font-size: 15px; font-weight: 850; line-height: 1.3; color: var(--ink); margin-bottom: 3px; }
    .summary-detail { font-size: 13.5px; line-height: 1.45; color: var(--muted); }

    .grid { display: grid; gap: 16px; }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .action-card { border-left: 5px solid var(--teal); }

    .risk-card { border-left: 5px solid var(--red); background: #ffffff; }

    .risk-kicker {
      color: var(--red);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }

    .mini-title { margin: 0 0 8px; font-size: 15px; font-weight: 850; color: var(--ink); }
    .body-copy { margin: 0; color: var(--text); font-size: 14px; }

    .decision-section { margin-bottom: 18px; }
    .decision-section .section-title { margin: 0 0 14px; }

    .decision-flow {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 42px;
      align-items: stretch;
    }

    .decision-card {
      position: relative;
      min-width: 0;
      border: 1px solid var(--border);
      border-top-width: 6px;
      border-radius: var(--radius);
      padding: 22px 24px 24px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.09);
    }

    .decision-card:not(:last-child)::after {
      content: "→";
      position: absolute;
      top: 50%;
      right: -38px;
      width: 34px;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
    }

    .decision-card.context { border-color: var(--teal-border); border-top-color: var(--teal); background: var(--teal-soft); }
    .decision-card.impact { border-color: var(--amber-border); border-top-color: #d97706; background: var(--amber-soft); }
    .decision-card.risk { border-color: var(--red-border); border-top-color: #dc2626; background: var(--red-soft); }

    .decision-step {
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4b5563;
    }

    .decision-card-title {
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 850;
      line-height: 1.22;
      letter-spacing: -0.02em;
    }

    .decision-card-copy { margin: 0; color: var(--text); font-size: 15px; line-height: 1.58; }

    /* Decision outcome must not share a tinted fill with the adjacent
       Situation card — plain white with only the teal border, per style
       guide §8. */
    .decision-outcome {
      margin: 22px 0 18px;
      padding: 22px 26px;
      border: 2px solid var(--teal);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .decision-outcome-title {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: 20px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .decision-outcome-copy { margin: 0; color: #1f2937; font-size: 16px; font-weight: 650; line-height: 1.55; }

    .theme-flow-card { padding: 22px; }
    .theme-flow-inline { border-top: 1px solid var(--border); padding: 26px 20px 20px; }
    .flow-intro { margin-bottom: 20px; }

    .flow-section-title {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 850;
      line-height: 1.25;
      letter-spacing: -0.025em;
    }

    .flow-intro p { margin: 0; color: var(--text); font-size: 15px; line-height: 1.55; }

    .tag-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .legend-item { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }

    .legend-swatch {
      width: 18px;
      height: 10px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(17, 24, 39, 0.12);
    }

    .legend-swatch.inferred {
      background: rgba(124, 58, 237, 0.1);
      border: 1.5px dashed rgba(124, 58, 237, 0.55);
    }

    .theme-flow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px minmax(0, 1fr) 42px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .flow-column {
      border-radius: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-self: start;
    }

    .flow-column.root { background: var(--red-soft); border-color: var(--red-border); }
    .flow-column.symptom { background: var(--amber-soft); border-color: var(--amber-border); }
    .flow-column.consequence { background: var(--teal-soft); border-color: var(--teal-border); }

    .flow-step-label {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .flow-column h3 { margin: 0 0 8px; font-size: 18px; line-height: 1.2; letter-spacing: -0.025em; color: var(--ink); }
    .flow-column p { margin: 0 0 16px; color: var(--text); font-size: 14px; line-height: 1.5; }

    .flow-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

    .flow-tags span {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(17, 24, 39, 0.08);
      color: #374151;
      font-size: 12px;
      font-weight: 750;
    }

    .flow-tags span.inferred {
      background: rgba(124, 58, 237, 0.08);
      border: 1.5px dashed rgba(124, 58, 237, 0.5);
      color: #6d28d9;
      font-weight: 700;
      font-style: italic;
    }

    .flow-arrow { display: grid; place-items: center; color: #9ca3af; font-size: 28px; font-weight: 900; }

    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--soft);
      border: 1px solid var(--border);
      color: #4b5563;
      font-size: 12px;
      font-weight: 750;
    }

    .pill.root { background: var(--red-soft); border-color: var(--red-border); color: var(--red); }
    .pill.symptom { background: var(--amber-soft); border-color: var(--amber-border); color: var(--amber); }
    .pill.consequence { background: var(--teal-soft); border-color: var(--teal-border); color: var(--teal); }

    .theme-stack { display: grid; gap: 14px; }

    details.theme {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    details.theme[open] { border-color: #cbd5e1; }
    details.theme.unclassified-card { border-left: 5px solid var(--amber); }

    summary { cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }

    .theme-summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 20px;
    }

    .theme-title { margin: 0; font-size: 19px; line-height: 1.25; letter-spacing: -0.02em; color: var(--ink); }
    .theme-description { margin: 8px 0 0; color: var(--text); font-size: 14px; max-width: 820px; }

    .theme-action {
      margin-top: 12px;
      padding: 12px 14px;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
    }

    .theme-action strong { color: var(--ink); }

    .expand {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 22px;
      font-weight: 850;
    }

    details[open] .expand::before { content: "−"; }
    details:not([open]) .expand::before { content: "+"; }

    .theme-body { padding: 0 20px 22px; }

    .insight-detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr);
      gap: 18px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .insight-detail-layout > *,
    .evidence-panel,
    .evidence-list,
    .evidence-item,
    .evidence-item p { min-width: 0; }

    .panel-kicker {
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .evidence-panel {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      overflow: hidden;
    }

    .evidence-panel h4,
    .suggestion-panel h4 { margin: 0 0 14px; font-size: 18px; letter-spacing: -0.025em; color: var(--ink); }

    .evidence-list { display: grid; gap: 12px; }

    .evidence-item {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #edf0f3;
    }

    .evidence-number {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--teal-soft);
      color: var(--teal);
      border: 1px solid var(--teal-border);
      font-size: 12px;
      font-weight: 900;
    }

    .evidence-item p {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .insight-side { display: grid; gap: 16px; align-content: start; }

    .suggestion-panel {
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 18px;
      padding: 20px;
    }

    .suggestion-panel p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--teal); font-weight: 650; }

    .monitor-panel { background: var(--teal); border-radius: 18px; padding: 20px; color: white; }
    .monitor-panel .panel-kicker { color: #a2c4c9; }

    .metric-list { display: grid; gap: 12px; }

    .metric-item {
      display: grid;
      grid-template-columns: 14px 1fr;
      gap: 10px;
      align-items: start;
      color: #f2f2f2;
      font-size: 13.5px;
      line-height: 1.45;
    }

    .metric-dot {
      width: 8px;
      height: 8px;
      margin-top: 7px;
      border-radius: 999px;
      background: var(--teal-accent);
      box-shadow: 0 0 0 4px rgba(58, 188, 181, 0.18);
    }

    .state-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 800;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      color: var(--teal);
    }

    .state-badge.concentrated {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber);
    }

    .concentration-note { margin-top: 10px; font-size: 13px; line-height: 1.5; color: var(--amber); }
    .baseline-caption { margin-top: 8px; font-size: 12.5px; color: var(--muted); }

    .report-footer {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1040px) {
      .meta-cluster.cols-3 { max-width: 100%; }
    }

    @media (max-width: 920px) {
      .executive-columns,
      .grid-3,
      .theme-flow,
      .insight-detail-layout,
      .meta-cluster.cols-2,
      .meta-cluster.cols-3 { grid-template-columns: 1fr; }

      .meta-cluster { max-width: 100%; }
      .flow-arrow { transform: rotate(90deg); height: 28px; }
      .flow-column { min-height: auto; }
      .theme-summary { grid-template-columns: 1fr; }
      .expand { display: none; }
      .decision-flow { grid-template-columns: 1fr; gap: 42px; }

      .decision-card:not(:last-child)::after {
        content: "↓";
        top: auto;
        right: 50%;
        bottom: -35px;
        transform: translateX(50%);
      }

      .header-buttons { width: 100%; }
    }

    @media (max-width: 620px) {
      .header-top { gap: 16px; }
      .brand-logo { width: 118px; }
      .report-title { font-size: 28px; }

ort not raised by anyone else in this batch.\n2026-08-08,jhargrove,Reporter,-,kobai/backend#512,\"SSO login causes dashboard to hang on load — Confirmed on our end too — after SSO auth completes, the dashboard spinner runs for close to a minute before anything renders.\",SSO Dashboard Load Performance,-\n2026-08-15,lmartins,Reporter,-,kobai/backend#518,Dashboard performance degraded since SSO provider change — Load times for the main dashboard have gotten noticeably worse for every account using SSO since the provider config change went out.,SSO Dashboard Load Performance,-\n2026-08-22,jhargrove,Reporter,-,kobai/backend#525,\"SSO redirect sometimes fails to complete — Occasionally the SSO redirect just fails partway through, leaving the user on a blank page with no error message.\",SSO Redirect and Session Failures,-\n2026-08-29,rkovacs,Reporter,-,kobai/backend#531,\"Slow dashboard render after SSO persists post-patch — Re-tested after the recent patch, dashboard render time following SSO login is still much slower than before the provider update.\",SSO Patch Ineffectiveness,-\n2026-09-02,dfischer,Reporter,-,kobai/backend#536,\"Request to expose an internal debug flag — Would be handy to have an internal-only debug flag exposed in settings, nobody else has asked for this so far.\",Other / Unclassified,A one-off internal request for a debug flag with no recurrence elsewhere in this batch.",

<script>
(function () {

  /* ── per-client branding config — edit these two lines per client build ── */
  var CLIENT_NAME = "Kobai";
  var CLIENT_LOGO_MARKUP = '<span class="client-logo-fallback">Kobai</span>';
  // Swap CLIENT_LOGO_MARKUP per client build, e.g.:
  // var CLIENT_LOGO_MARKUP = '<img src="https://.../kobai-logo.svg" alt="Kobai logo">';

  function esc(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function safeParse(raw, fallback) {
    try {
      if (!raw || raw === "null" || raw === "undefined") return fallback;
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  function formatMonthYear(dateStr) {
    if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return "";
    var d = new Date(dateStr + "T00:00:00Z");
    return d.toLocaleString("en-GB", { month: "short", year: "numeric", timeZone: "UTC" });
  }

  var CATEGORY_DEFAULTS = {
    root: "Root cause",
    symptom: "Operational symptom",
    consequence: "Business consequence"
  };

  function pillClass(catClass) {
    return ["root", "symptom", "consequence"].includes(catClass) ? catClass : "";
  }

  function categoryLabel(theme) {
    if (theme.category_label) return theme.category_label;
    return CATEGORY_DEFAULTS[theme.category_class] || "";
  }

  var csvBundle   = safeParse(document.getElementById("combinedCsvsData")?.textContent, {});
  var displayData = safeParse(document.getElementById("themeDisplayData")?.textContent,
                      { total_feedback_rows: 0, has_company_data: false, has_previous_run: false, flagged_theme_count: 0, flagged_theme_names: [], themes: [] });
  var execSummary = safeParse(document.getElementById("executiveSummaryData")?.textContent, {});
  var unclassifiedItems = (safeParse(document.getElementById("unclassifiedItemsData")?.textContent, { items: [] }).items) || [];

  var allThemes     = Array.isArray(displayData.themes) ? displayData.themes : [];
  var unclassified  = allThemes.find(t => (t?.theme_name || "").trim() === "Other / Unclassified");
  var visibleThemes = allThemes
    .filter(t => (t?.theme_name || "").trim() !== "Other / Unclassified")
    .sort((a, b) => {
      var diff = (b?.data_by_theme?.signals ?? 0) - (a?.data_by_theme?.signals ?? 0);
      if (diff !== 0) return diff;
      diff = (b?.data_by_theme?.companies ?? 0) - (a?.data_by_theme?.companies ?? 0);
      if (diff !== 0) return diff;
      return (a.theme_name || "").localeCompare(b.theme_name || "");
    });

  var totalRows = Number(displayData.total_feedback_rows || 0);

  /* ── report subject / header / meta cluster ─────────────────────────────────── */
  var reportDateText = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  var reportTitleText = CLIENT_NAME + " insights, " + reportDateText;
  var reportSubtitleText = "Weekly report";
  document.title = reportTitleText + " | Intuifi";
  document.getElementById("reportTitle").textContent = reportTitleText;
  document.getElementById("reportSubtitle").textContent = reportSubtitleText;
  document.getElementById("clientLogoBox").innerHTML = CLIENT_LOGO_MARKUP;
  document.getElementById("clientLogoBox").setAttribute("aria-label", CLIENT_NAME);

  (function renderMetaCluster() {
    var el = document.getElementById("metaCluster");
    var noThemeCount = Number(unclassified?.data_by_theme?.signals || 0);
    var hasPreviousRun = displayData.has_previous_run === true;

    function formatDelta(n) {
      if (n == null) return null;
      if (n === 0) return { text: "No change", noChange: true };
      var arrow = n > 0 ? "↑" : "↓";
      return { text: arrow + " " + Math.abs(n) + " since last report", noChange: false };
    }

    var ICONS = {
      records: '<svg class="meta-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>',
      theme: '<svg class="meta-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8a6 6 0 0 0-12 0c0 1 .23 2.23 1.5 3.5.72.72 1.23 1.53 1.41 2.5"/></svg>',
      warning: '<svg class="meta-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--amber);"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
    };
    var cards = [
      { cls: "primary", icon: ICONS.records, value: totalRows, label: "records analysed", delta: hasPreviousRun ? formatDelta(displayData.records_delta) : null },
      {
        cls: "primary",
        icon: ICONS.theme,
        value: visibleThemes.length,
        label: visibleThemes.length === 1 ? "theme identified" : "themes identified",
        delta: hasPreviousRun ? formatDelta(displayData.themes_delta) : null
      }
    ];

    if (unclassified) {
      cards.push({
        cls: "warning",
        icon: ICONS.warning,
        value: noThemeCount,
        label: noThemeCount === 1
          ? "item with no theme assigned"
          : "items with no theme assigned",
        delta: hasPreviousRun ? formatDelta(displayData.unclassified_delta) : null,
        emphasis: true
      });
    }

    function deltaHtml(c) {
      if (!c.delta) return "";
      var classes = "meta-card-delta" + (c.emphasis ? " emphasis" : "") + (c.delta.noChange ? " no-change" : "");
      return `<div class="${classes}">${esc(c.delta.text)}</div>`;
    }

    var columnsClass = cards.length === 1 ? "cols-1" : cards.length === 2 ? "cols-2" : "cols-3";
    el.className = "meta-cluster " + columnsClass;
    el.innerHTML = cards.map(c => {
      if (c.cls === "warning") {
        return `<button type="button" id="unclassifiedJumpCard" class="meta-card warning meta-card-clickable" aria-label="Jump to items with no theme assigned">
          <div class="meta-card-main">${c.icon}<div class="meta-card-text"><strong>${esc(c.value)}</strong><span>${esc(c.label)}</span></div>
          <svg class="meta-card-jump-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></div>
          ${deltaHtml(c)}
        </button>`;
      }
      return `<div class="meta-card ${c.cls}"><div class="meta-card-main">${c.icon}<div class="meta-card-text"><strong>${esc(c.value)}</strong><span>${esc(c.label)}</span></div></div>${deltaHtml(c)}</div>`;
    }).join("");

    var jumpBtn = document.getElementById("unclassifiedJumpCard");
    if (jumpBtn) {
      jumpBtn.addEventListener("click", function () {
        var target = document.getElementById("unclassifiedItemsCard");
        if (target) {
          target.open = true;
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    }
  })();

  /* ── header summary line (comparison runs only) ─────────────── */
  (function renderHeaderSummary() {
    var el = document.getElementById("headerSummaryLine");
    if (!el || displayData.has_previous_run !== true) return;

    // Reads flagged_theme_count directly from theme_display_json rather than
    // recomputing it — BUILD DISPLAY DATA already derived this from the same
    // themes array being rendered below, so the badge can never disagree
    // with which cards actually show a change_state badge.
    var flaggedCount = Number(displayData.flagged_theme_count || 0);

    el.style.display = "inline-flex";
    if (flaggedCount === 0) {
      el.className = "header-summary-line";
      el.textContent = "No themes flagged this period";
    } else {
      el.className = "header-summary-line flagged";
      el.textContent = flaggedCount + (flaggedCount === 1 ? " theme flagged" : " themes flagged");
    }
  })();

  /* ── at a glance (mid-level detail card) ────────────────────── */
  (function renderExecutiveSummary() {
    var el = document.getElementById("executiveBody");

    function summaryItems(items, iconClass, iconGlyph) {
      var list = (items || []).filter(Boolean);
      if (!list.length) return "<div class=\"summary-detail\">Nothing to show yet.</div>";
      return `<div class="summary-list">${list.map(item => {
        if (typeof item === "string") {
          return `<div class="summary-item">
            <div class="summary-icon ${iconClass}">${iconGlyph}</div>
            <div><div class="summary-headline">${esc(item)}</div></div>
          </div>`;
        }
        return `<div class="summary-item">
          <div class="summary-icon ${iconClass}">${iconGlyph}</div>
          <div>
            <div class="summary-headline">${esc(item.headline || "")}</div>
            ${item.detail ? `<div class="summary-detail">${esc(item.detail)}</div>` : ""}
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    function themeIndexItems(themes) {
      if (!themes.length) return "<div class=\"summary-detail\">No themes to show yet.</div>";

      var TOP_N = 5;
      var shown = themes.slice(0, TOP_N);
      var remaining = themes.length - shown.length;

      var itemsHtml = shown.map((t, i) => {
        var d = t.data_by_theme || {};
        var stat = [
          d.signals != null ? d.signals + " signals" : null,
          d.proportion_of_feedback != null ? d.proportion_of_feedback + "% of feedback" : null
        ].filter(Boolean).join(" · ");
        return `<div class="summary-item">
          <div class="summary-icon check">${i + 1}</div>
          <div>
            <div class="summary-headline">${esc(t.theme_name)}</div>
            ${stat ? `<div class="summary-detail">${esc(stat)}</div>` : ""}
          </div>
        </div>`;
      }).join("");

      var moreHtml = remaining > 0
        ? `<div class="summary-detail" style="margin-top:10px;">+ ${remaining} more theme${remaining === 1 ? "" : "s"} — see "Detailed themes and evidence" below</div>`
        : "";

      return `<div class="summary-list">${itemsHtml}</div>${moreHtml}`;
    }

    var implicationHtml = execSummary.strategic_implication
      ? `<div class="tldr-box">
           <div class="tldr-label">Strategic implication</div>
           <div class="tldr-text">${esc(execSummary.strategic_implication)}</div>

    el.innerHTML = `
      ${implicationHtml}
      <div class="executive-columns">
        <div class="executive-panel">
          <div class="panel-title">Themes</div>
          ${themeIndexItems(visibleThemes)}
        </div>
        <div class="executive-panel tension">
          <div class="panel-title">Tensions to be aware of</div>

  (function renderThemeFlow() {

    if (!flow || typeof flow !== "object") { host.innerHTML = ""; return; }

    var layers = [
      { key: "root_cause",  cls: "root",       num: 1, defaultLabel: "Root causes" },
      { key: "symptom",     cls: "symptom",    num: 2, defaultLabel: "Operational symptoms" },
      { key: "consequence", cls: "consequence", num: 3, defaultLabel: "Business consequence" }
    ];

    var hasAnyHeadline = layers.some(l => flow[l.key] && flow[l.key].headline);
    if (!hasAnyHeadline) { host.innerHTML = ""; return; }

    var hasInferred = layers.some(l => Array.isArray(flow[l.key]?.inferred_tags) && flow[l.key].inferred_tags.length);

    var columnsHtml = layers.map((l, idx) => {
      var layerData = flow[l.key] || {};
      var themeTags = visibleThemes
        .filter(t => pillClass(t.category_class) === l.cls)
        .map(t => `<span>${esc(t.theme_name)}</span>`);
      var inferredTags = (Array.isArray(layerData.inferred_tags) ? layerData.inferred_tags : [])
        .filter(Boolean)
        .map(t => `<span class="inferred">${esc(t)}</span>`);

      var column = `
        <div class="flow-column ${l.cls}">
          <div class="flow-step-label">${l.num}. ${esc(layerData.label || l.defaultLabel)}</div>
          <h3>${esc(layerData.headline || "")}</h3>
          <p>${esc(layerData.description || "")}</p>
          <div class="flow-tags">${themeTags.join("")}${inferredTags.join("")}</div>

      } else {

        && displayData.flagged_theme_names.includes(theme.theme_name);
